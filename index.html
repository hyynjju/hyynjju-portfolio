<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyunju Cho | UX/UI Designer Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- iOS -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@200;300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #040809;
        --text-main: #fafafa;
        --text-muted: #71717a;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Archivo', sans-serif;
        overflow-x: hidden;
        margin: 0;
      }

      body.cursor-hidden {
        cursor: none;
      }

      .serif {
        font-family: 'Archivo', sans-serif;
      }
      .mono {
        font-family: 'Archivo', sans-serif;
      }

      .btn-monotone {
        background-color: white;
        color: #000;
        transition: all 0.3s ease;
        cursor: none;
      }
      .btn-monotone:hover {
        background-color: #e5e5e5;
      }

      .glass {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* Hero-only teal gradient: transparent at top, deep teal at bottom */
      .hero-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          transparent 20px,
          rgba(106, 240, 255, 0.4) 100%
        );
        z-index: -1;
        pointer-events: none;
      }

      #cursor-container {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10000;
        transition: opacity 0.3s ease;
      }

      /* Class to hide original cursor when project preview is active */
      body.project-hovering #cursor-container {
        opacity: 0;
      }

      .custom-cursor {
        width: 8px;
        height: 8px;
        background: white;
        border-radius: 50%;
        position: absolute;
        transition: transform 0.1s ease-out;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      .custom-cursor-follower {
        width: 32px;
        height: 32px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        position: absolute;
        transition: transform 0.2s ease-out;
      }

      .screen-transition {
        position: fixed;
        inset: 0;
        z-index: 10001;
        background: linear-gradient(
          135deg,
          #040809 0%,
          #0e7490 50%,
          #040809 100%
        );
        transform: translateY(100%);
        transition: transform 1.5s cubic-bezier(0.8, 0, 0.2, 1);
        pointer-events: none;
      }
      .screen-transition.active {
        transform: translateY(0);
        pointer-events: all;
      }

      /* Fix X (Twitter) in-app browser viewport bug */
      body.in-app-browser .screen-transition {
        display: none !important;
      }

      .scroll-reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .scroll-reveal.visible {
        opacity: 1;
        transform: translateY(0);
      }

      ::-webkit-scrollbar {
        width: 3px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }

      .grain-overlay::after {
        content: '';
        position: fixed;
        top: -110%;
        left: -110%;
        width: 300%;
        height: 300%;
        background-image: url('https://grainy-gradients.vercel.app/noise.svg');
        background-repeat: repeat;
        opacity: 0.02;
        pointer-events: none;
        z-index: 9998;
      }
    </style>
    <style>
      @media (hover: none) and (pointer: coarse) {
        #cursor-container {
          display: none;
          pointer-events: none;
        }

        body {
          cursor: auto;
        }
      }
    </style>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="grain-overlay">
    <div id="cursor-container">
      <div class="custom-cursor" id="cursor"></div>
      <div class="custom-cursor-follower" id="cursor-follower"></div>
    </div>

    <div class="screen-transition" id="transition-overlay"></div>
    <div id="root"></div>

    <script>
      const isTouchDevice = window.matchMedia(
        '(hover: none) and (pointer: coarse)'
      ).matches;

      if (!isTouchDevice) {
        document.body.classList.add('cursor-hidden');
      }

      if (!isTouchDevice) {
        const cursor = document.getElementById('cursor');
        const follower = document.getElementById('cursor-follower');

        document.addEventListener('mousemove', (e) => {
          cursor.style.transform = `translate3d(${e.clientX - 4}px, ${
            e.clientY - 4
          }px, 0)`;
          follower.style.transform = `translate3d(${e.clientX - 16}px, ${
            e.clientY - 16
          }px, 0)`;
        });

        document.addEventListener('mousedown', (e) => {
          if (e.pointerType === 'touch') return;
          cursor.style.transform += ' scale(2.5)';
        });

        document.addEventListener('mouseup', (e) => {
          if (e.pointerType === 'touch') return;
          cursor.style.transform = cursor.style.transform.replace(
            ' scale(2.5)',
            ''
          );
        });
      }
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.2.3",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "react/": "https://esm.sh/react@^19.2.3/",
          "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
